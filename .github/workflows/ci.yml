name: CI

on:
  push:
    branches: [main]
  pull_request:

# Key by head SHA so duplicate pull_request events for the same commit (e.g.
# gt submit pushing and opening/retargeting a PR in the same instant) share a
# group and serialize instead of one twin being cancelled — a cancelled run
# attached to the current head SHA reads as a failing rollup. A force-push gets
# a fresh group, so no run for the current head is ever cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy src tests
      - name: pytest
        run: uv run pytest
      - name: Build package
        run: uv build
      - name: Inspect package contents
        run: uv run python scripts/check_package_contents.py

  release:
    name: Cut GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'outfitter-dev/dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - id: cut
        name: Cut GitHub Release if version is untagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/cut_github_release.py --apply
      - name: Dispatch PyPI publish
        if: steps.cut.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh workflow run publish.yml
          --ref "${{ steps.cut.outputs.tag }}"
          -f tag="${{ steps.cut.outputs.tag }}"
