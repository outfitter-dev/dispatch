name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR event deliveries run independently, including duplicate events for one SHA.
# Main pushes share a group without cancelling an in-progress release; GitHub
# may still replace an older pending main run with a newer one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Bootstrap checkout
        run: ./scripts/bootstrap.sh
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy src tests
      - name: pytest
        run: uv run pytest
      - name: Build package
        run: uv build
      - name: Inspect package contents
        run: uv run python scripts/check_package_contents.py

  bootstrap-macos:
    name: Bootstrap smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Bootstrap checkout
        run: ./scripts/bootstrap.sh
      - name: Verify editable project, dev group, and CLI
        run: |
          uv run --locked python -c 'import pathlib, pytest, outfitter.dispatch.cli as m; assert pathlib.Path(m.__file__).resolve() == pathlib.Path("src/outfitter/dispatch/cli.py").resolve()'
          uv run --locked dispatch --help

  release:
    name: Cut GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'outfitter-dev/dispatch'
    needs: [check, bootstrap-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - id: cut
        name: Cut GitHub Release if version is untagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/cut_github_release.py --apply
      - name: Dispatch PyPI publish
        if: steps.cut.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh workflow run publish.yml
          --ref "${{ steps.cut.outputs.tag }}"
          -f tag="${{ steps.cut.outputs.tag }}"
