[project]
name = "outfitter-dispatch"
version = "0.9.0"
description = "Local control plane for orchestrating Codex agent lanes over the Codex App Server."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Matt Galligan", email = "dispatch@outfitter.dev" }]
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "structlog>=24",
    "croniter>=3",
    "mcp>=1.2",
    "httpx>=0.28,<1",
    "httpcore>=1.0,<2",
]

[project.scripts]
dispatch = "outfitter.dispatch.cli:app"
dispatchd = "outfitter.dispatch.daemon.__main__:main"
dispatch-claude-statusline = "outfitter.dispatch.claude_statusline_cli:main"

[project.urls]
Homepage = "https://github.com/outfitter-dev/dispatch"
Repository = "https://github.com/outfitter-dev/dispatch"
Issues = "https://github.com/outfitter-dev/dispatch/issues"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PEP 420 namespace: ship src/outfitter/ (no __init__.py at the outfitter level);
# the importable package is outfitter.dispatch.
[tool.hatch.build.targets.wheel]
packages = ["src/outfitter"]
exclude = ["/src/**/AGENTS.md"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/dispatch/skills" = "outfitter/dispatch/assets/skills"
"plugins/dispatch" = "outfitter/dispatch/assets/plugins/dispatch"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/skills",
    "/plugins/dispatch",
    "/README.md",
    "/AGENTS.md",
    "/pyproject.toml",
    "/uv.lock",
    "/justfile",
]
exclude = ["/src/**/AGENTS.md"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"
# spikes/ are preserved verification probes (reference + seed of the integration
# suite), promoted into tests/ in Phase 1. Not part of the quality gate as-is.
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
module = ["croniter.*"]
ignore_missing_imports = true

# The mcp SDK's list_tools()/call_tool() decorators are untyped; relax only the
# decorator/call strictness in the thin MCP wiring module (its logic stays typed).
[[tool.mypy.overrides]]
module = ["outfitter.dispatch.surfaces.mcp"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests need a real codex app-server; deselect by default (run them
# with `just test-int`). They also auto-skip when codex/auth are unavailable.
addopts = "-ra -m 'not integration'"
markers = [
    "integration: requires a real ephemeral codex app-server (isolated CODEX_HOME)",
]
